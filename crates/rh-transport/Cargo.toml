[package]
name = "rh-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 进程级 KCP 诊断计数(kcp_loopback_bench 专用)。默认关闭:开启后
# 生产每包路径对同一 static 缓存行付 5-7 次原子 RMW,跨核多会话下
# 缓存行乒乓;关闭时递增点全部编译期移除(kcp.rs bump_counter 宏)。
perf-counters = []

[dependencies]
rh-protocol = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }

futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = "1"
rcgen = { workspace = true }
quinn = { workspace = true }
kcp = { workspace = true }
yamux = { workspace = true }
tokio-tungstenite = { workspace = true }
snap = { workspace = true }
pin-project-lite = "0.2"
rand = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
socket2 = { workspace = true }
bytes = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# kcp 回归测试用 start_paused(可控时钟)
tokio = { workspace = true, features = ["test-util"] }

# compress_bench 例子的 RSS 探针(仅诊断,不进产品路径)
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"


# 质量门禁:每个 PR / 每次推 main 都跑测试与 lint。
#
# 为什么必须存在:仓库里有一条**只能在 Linux 上跑**的测试
# (`crates/rh-transport/src/tcp.rs` 的
# `pool_full_keeps_connections_in_kernel_accept_queue`),它靠 `ss` 读内核
# accept 队列长度,是唯一能区分「握手背压是否真的前移到 accept 之前」的
# 观测量。此前 `release.yml` 只构建、不测试,这条用例在 CI 里从未执行过 ——
# 也就是说那个修复在 CI 上**零覆盖**,回归了也没人知道。
#
# 本 job 只跑一次(Linux x86_64),不做平台矩阵:矩阵在 release.yml 里已经
# 覆盖编译面,这里的目的是执行测试本身。
#
# **刻意不含 `cargo fmt --check`**:仓库当前有 93 处 fmt 差异(24 个文件),
# 是既有状态。加进去会让门禁一上线就红,而"红的门禁"很快就会被无视 ——
# 那比没有门禁更糟。要加,先把 fmt 单独整理成一次纯格式化提交。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: 确认 ss 可用(背压测试依赖它)
        # `ss` 由 iproute2 提供,ubuntu-latest 预装。显式确认是为了让
        # 「工具缺失 → 该测试被静默跳过」变成一条**显式失败**:
        # `accept_backlog_len()` 拿不到输出时返回 None,测试会 panic 而不是
        # 悄悄通过,但缺 `ss` 时的报错很难归因,不如在这里先断。
        run: |
          command -v ss || { sudo apt-get update && sudo apt-get install -y iproute2; }
          ss -V

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # 不构建前端:干净检出(无 console/dist)时 build.rs 不启用
        # `embed_ui`,纯 Rust 构建照常可用,测试也不读前端产物。
        # 反过来**不要**在这里造一个占位 dist —— 那会打开 embed_ui,
        # 让 CI 跑在与本地不同的代码路径上。
        run: cargo test --workspace --no-fail-fast

# rabbithole 服务端示例配置(生产部署请修改全部口令/密钥/域名)

# 控制面主监听(tcp/tls/ws/wss/quic/kcp)
bind_addr = "0.0.0.0"
bind_protocol = "tls"          # 公网建议 tls;本机调试可用 tcp
bind_port = 7100
multiplex = true
# 多载体池允许的最大载体数(含首载体,round-10;钳制 1..=8,默认 8)。
# 客户端报到时经 CARRIER_ATTACH_ACK 读取并按 min(期望, 硬件, 该值) 定容;
# 0 视为 1。运行中不补拨:客户端只在报到阶段收敛一次。
# max_carriers = 8
# 数据面中继模式:splice(Linux 零拷贝,默认)| copy(用户态拷贝)。
# splice 仅在两端均为裸 TCP(裸模式明文载体、无压缩包装)时启用,
# 其余场景自动回落 copy;对吞吐无损,显著降低大流量 CPU(实测约减半)。
# relay_mode = "splice"

# 追加监听(可选;不同协议/端口)
# [[listeners]]
# protocol = "kcp"
# bind_port = 7101
# multiplex = true

[web]
bind_addr = "127.0.0.1"        # 管理面默认仅本地;对外请置反向代理 + HTTPS
port = 8080
# jwt_secret = "change-me-32-bytes-minimum-secret!!"
jwt_ttl_hours = 12
# static_dir = "../console/dist"   # 可选:磁盘静态资源目录(SPA 回退已内置;不配置时用构建期内嵌控制台)。
# 不配置时:若构建期内嵌了前端(build.rs 检测到 dist 则 rust-embed 嵌入二进制),
# 直接由二进制托管控制台;配置了则以磁盘目录为准(优先级高于内嵌)。

[vhost]
http_port = 8081
https_port = 8443              # 0 = 关闭
tcpmux_port = 8082
subdomain_host = "example.com"
# custom_404_page = "/etc/rabbithole/404.html"

[ssh_gateway]
enabled = false
bind_port = 2222
bind_addr = "0.0.0.0"
# authorized_keys_file = "/etc/rabbithole/authorized_keys"
# auto_gen_key_dir = "/var/lib/rabbithole/certs"

[ports]
auto_range = "20000-21000"
allow_ports = ["10000-40000"]  # 空 = 不限制
max_services_per_client = 32

[limits]
# 并发上限默认全部 0 = 不限(交由系统层 fd/内存/端口兜底);均可在控制台热改。
# max_mux_streams = 0            # 单复用连接并发流硬顶(0=不限;新会话生效;QUIC 需重启)
# max_data_conns_per_client = 0  # 每客户端并发数据通道(0=不限;立即生效;自动钳制到流上限-1024)
# max_udp_sessions_per_proxy = 0 # 每规则 UDP 会话数(0=不限;立即生效)
# max_pool_size = 0              # 每规则池深上限(0=不限;仅新建/更新规则生效)
default_pool_size = 2
# control_send_queue = 256       # 控制帧发送队列(满则背压;新会话生效)
# unauth_conns_per_ip = 64       # 每 IP 认证窗口并发(0=不限;防匿名洪水,不建议关)
# udp_packet_size = 65536        # UDP 报文缓冲(实际取 max(1500, 此值))
# pool_wait_timeout_ms = 10000   # 用户连接等池补拨总时长

[nathole]
# stun_server = ""             # XTCP 打洞;空 = 本机地址候选

[metrics]
# Prometheus 抓取端点(独立端口,不与管理面共口,无鉴权——靠监听地址控制暴露面)
enable_prometheus = false
bind_addr = "127.0.0.1"        # 默认仅本机抓取;远程直抓改 0.0.0.0(注意防火墙)
port = 9100

[log]
level = "info"

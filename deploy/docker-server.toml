# rabbithole 容器默认配置。首次启动由 docker-entrypoint.sh 复制到
# /var/lib/rabbithole/server.toml(数据卷),之后修改请直接编辑该文件或挂载覆盖。
# 首次启动会在数据卷生成初始 admin 随机密码(容器日志一次性打印)与自签 TLS 证书。

bind_addr = "0.0.0.0"
bind_protocol = "tls"          # 容器内自动生成自签证书;公网生产建议替换为正式证书
bind_port = 7100
multiplex = true
# 多载体池允许的最大载体数(含首载体,round-10;钳制 1..=8,默认 8)。
# 客户端报到时经 CARRIER_ATTACH_ACK 读取并按 min(期望, 硬件, 该值) 定容。
# max_carriers = 8

[web]
bind_addr = "0.0.0.0"          # 容器内必须 0.0.0.0 才能端口映射;生产请置反代 + HTTPS
port = 8080
jwt_ttl_hours = 12

[vhost]
http_port = 8081
https_port = 8443
tcpmux_port = 8082
subdomain_host = "example.com"   # 按域名访问必改

[ssh_gateway]
enabled = false
bind_port = 2222
bind_addr = "0.0.0.0"

[ports]
auto_range = "20000-21000"
allow_ports = ["10000-40000"]
max_services_per_client = 32

[limits]
# 并发上限默认全部 0 = 不限(交由系统层 fd/内存/端口兜底);均可在控制台热改。
# max_mux_streams = 0            # 单复用连接并发流硬顶(0=不限;新会话生效;QUIC 需重启)
# max_data_conns_per_client = 0  # 每客户端并发数据通道(0=不限;立即生效;自动钳制到流上限-1024)
# max_udp_sessions_per_proxy = 0 # 每规则 UDP 会话数(0=不限;立即生效)
# max_pool_size = 0              # 每规则池深上限(0=不限;仅新建/更新规则生效)
default_pool_size = 2
# control_send_queue = 256       # 控制帧发送队列(满则背压;新会话生效)
# unauth_conns_per_ip = 64       # 每 IP 认证窗口并发(0=不限;防匿名洪水,不建议关)
# udp_packet_size = 65536        # UDP 报文缓冲(实际取 max(1500, 此值))
# pool_wait_timeout_ms = 10000   # 用户连接等池补拨总时长

[metrics]
# 容器内需 0.0.0.0 才能经端口映射抓取(-p 9100:9100);端口无鉴权,仅在内网/加固后暴露
enable_prometheus = false
bind_addr = "0.0.0.0"
port = 9100

[log]
level = "info"

# rabbithole 客户端示例配置
# server_addr / client_id / secret 必填;凭据在 Web 控制台"客户端"页创建(仅展示一次)

server_addr = "203.0.113.10:7100"
protocol = "tls"               # 与服务端监听协议一致
multiplex = true

# 多载体池规模。三态语义:
#   缺省(不写)  = 自动:按实测 RTT 选载体数
#                  RTT < 5ms   → 1(局域网,单 TCP 窗口已够,多开只增开销)
#                  RTT 5~15ms  → 2
#                  RTT >= 15ms → 4(单窗口成为瓶颈,多载体有净收益)
#                  再经硬件上限与服务端 max_carriers 收敛,最终钳制 [1,8]
#   mux_pool_size = 1  = 强制单载体(严格等价旧路径,不建池)
#   mux_pool_size = n  = 显式期望 n(仍受硬件上限、服务端上限与 8 钳制)
# 环境变量 RH_MUX_POOL_SIZE 仅在配置文件未显式设置时生效(正整数,非法报错)。
# 显式配置优先于 RTT 自适应(设了就不探测)。
# QUIC/KCP 自带多路复用,恒单载体,忽略本参数。
# mux_pool_size = 4

client_id = "00000000-0000-0000-0000-000000000000"
secret = "在控制台创建客户端时获取"

# TLS
# trusted_ca_file = "/etc/rabbithole/ca.pem"
# server_name = "rabbithole.example.com"
tls_insecure_skip_verify = false
# tls_pin_sha256 = ""

# 经 HTTP/SOCKS5 代理连服务端(可选)
# proxy_url = "http://user:pass@proxy:8080"


# XTCP 打洞 STUN(可选)
# stun_server = "1.2.3.4:3478"

# 自定义 DNS(可选;解析规则目标域名时使用)
# dns_server = "10.0.0.1:53"

log_level = "info"

# 规则(转发/访问器)由服务端集中下发,客户端配置文件不再声明规则;
# 重启/重连自动恢复。

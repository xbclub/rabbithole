[workspace]
resolver = "2"
members = [
    "crates/rh-protocol",
    "crates/rh-transport",
    "crates/rh-core",
    "crates/rh-server",
    "crates/rh-client",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/rabbithole"

[workspace.dependencies]
rh-protocol = { path = "crates/rh-protocol" }
rh-transport = { path = "crates/rh-transport" }
rh-core = { path = "crates/rh-core" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
socket2 = "0.6"

# transport
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
quinn = "0.11"
kcp = "0.6"
yamux = { path = "vendor/yamux" }
tokio-tungstenite = "0.30"
snap = "1"

# server
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
argon2 = "0.5"
jsonwebtoken = "9"
governor = "0.10"
prometheus = "0.14"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
httparse = "1"
russh = "0.64"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rand_core"] }
base64 = "0.22"
hickory-resolver = "0.26"

# 全局内存分配器(round-35)。两个二进制统一使用 mimalloc:
# 单 C 文件、无额外系统依赖、跨 Linux/macOS/Windows 同一份代码,
# 且对"跨线程释放的小对象"最友好(帧体在本线程分配、在 Worker 释放)。
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

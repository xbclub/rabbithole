[workspace]
resolver = "2"
members = [
    "crates/rh-protocol",
    "crates/rh-transport",
    "crates/rh-core",
    "crates/rh-server",
    "crates/rh-client",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/rabbithole"

[workspace.dependencies]
rh-protocol = { path = "crates/rh-protocol" }
rh-transport = { path = "crates/rh-transport" }
rh-core = { path = "crates/rh-core" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
socket2 = "0.6"

# transport
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
quinn = "0.11"
kcp = "0.6"
yamux = { path = "vendor/yamux" }
tokio-tungstenite = "0.30"
snap = "1"

# server
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
argon2 = "0.5"
jsonwebtoken = "9"
governor = "0.10"
prometheus = "0.14"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
httparse = "1"
russh = "0.64"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rand_core"] }
base64 = "0.22"
hickory-resolver = "0.26"

# 全局内存分配器(round-35)。两个二进制统一使用 mimalloc:
# 单 C 文件、无额外系统依赖、跨 Linux/macOS/Windows 同一份代码,
# 且对"跨线程释放的小对象"最友好(帧体在本线程分配、在 Worker 释放)。
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# 诊断档位:`cargo build --profile diag`。
#
# 与 `release` **完全同速**(继承全部优化选项),仅额外打开 `debug_assertions`,
# 让 `#[cfg(debug_assertions)]` 门控的断言/诊断参与编译。用于需要"真实吞吐 +
# 开发期检查"同时在场的场景(性能体检、复现只在优化构建下出现的时序问题)。
# `dev` 档位不能用:它不优化,测出来的数字与发版产物无可比性。
#
# 产物实测:比 release 大 2.3KB(14,969,984 -> 14,972,336),`debug_assert!`
# 文案进入二进制,而 release 中不存在。
#
# 注意:`debug-assertions = true` 也会激活 `debug_assert!` 宏
# (mux.rs / compress.rs 各一处)。那是预期行为,不是副作用。
# 若只想要诊断、不要溢出检查,可显式关掉:`CARGO_PROFILE_DIAG_OVERFLOW_CHECKS=false`
# (两者在 Cargo 中相互独立,已实测可解耦)。
#
# --- 为什么**不**把现有诊断改成 `#[cfg]` 门控(实测结论,勿重复尝试)---
#
# 曾评估"把 RH_PUMP_STATS / RH_SPLICE_STATS 等诊断从运行时 env 开关改为
# 编译期 cfg,使发版产物物理不含诊断"。结论是**不做**,三条实测依据:
#
#   1) 没有性能可省。这些诊断本就写成 `if diag { ...累加/计时... }`,
#      `diag` 默认 false => release 下分支体根本不执行。实测强制全开
#      (`RH_PUMP_STATS=1`)与关闭的吞吐差 **-0.01%**,是噪声。
#   2) 收益极小。全量 cfg 化后二进制只小 **176 字节**。
#   3) 会破坏 CI。cfg 化会让 release 下 `read_ns`/`write_ns` 等变成未使用
#      变量(`-D warnings` 直接失败);若改用自定义 cfg(如 `--cfg rh_diag`),
#      还要给**每个** crate 建 build.rs 声明 `rustc-check-cfg`,否则
#      `unexpected_cfgs` 同样在 `-D warnings` 下编译失败。
#
# 更重要的是**能力倒退**:env 开关允许线上出问题时临时开诊断、无需重编;
# cfg 掉了就必须重新出包。保留运行时开关是对的。
[profile.diag]
inherits = "release"
debug-assertions = true
